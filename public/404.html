      :root { color-scheme: light dark; --bg: #eceef1; --text: #16181d; --muted: #545a66; --accent: #2b4fd8; --on: #fff; }

      body { margin: 0; display: grid; min-height: 100vh; place-content: center; gap: 12px; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; color: var(--muted); }
      a { display: inline-block; justify-self: center; margin-top: 8px; padding: 12px 20px; border-radius: 8px; background: var(--accent); color: var(--on); font-weight: 600; text-decoration: none; }
